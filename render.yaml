# Render.com Blueprint — As Aventuras do Piper
# Como usar: suba esta pasta para um repositório no GitHub e, no Render,
# clique em "New +" > "Blueprint" e escolha o repositório.
services:
  - type: web
    name: aventuras-do-piper
    runtime: node
    plan: free            # troque para "starter" para não dormir e poder usar disco
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: XP_RATE
        value: "2"
      # Com disco persistente (somente planos pagos), descomente as linhas abaixo
      # e também o bloco "disk" — assim os personagens não se perdem a cada deploy.
      # - key: DATA_DIR
      #   value: /var/data
    # disk:
    #   name: dados-jogadores
    #   mountPath: /var/data
    #   sizeGB: 1
