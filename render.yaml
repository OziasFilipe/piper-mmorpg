# Render.com Blueprint — As Aventuras do Piper (Epiper Tecnologia)
# Fica na RAIZ do repositório. No Render: New + > Blueprint > escolha o repositório > Apply.
services:
  - type: web
    name: aventuras-do-piper
    runtime: node
    # IMPORTANTE: o plano "free" tem só 0,1 de CPU e DORME após 15 min sem acesso
    # (o primeiro acesso depois disso leva ~1 minuto). Para o jogo ficar rápido e
    # sempre ligado, use "starter" (0,5 CPU, não dorme, permite disco).
    plan: free
    region: virginia            # região mais próxima do Brasil
    branch: main
    autoDeploy: true
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: XP_RATE
        value: "2"
      # O servidor acessa o próprio /health a cada 10 min para não dormir (plano free).
      # Use "0" para desligar (ex.: se tiver outros serviços free e as 750 h/mês ficarem curtas).
      - key: KEEP_AWAKE
        value: "1"
      # Senha do painel admin (https://SEU-ENDERECO/admin). Preencha no painel do Render.
      - key: ADMIN_PASSWORD
        sync: false
      # ---- Para NÃO perder os personagens a cada deploy (somente plano starter) ----
      # 1) troque plan: free por plan: starter
      # 2) descomente as 2 linhas abaixo e o bloco "disk"
      # - key: DATA_DIR
      #   value: /var/data
    # disk:
    #   name: dados-jogadores
    #   mountPath: /var/data
    #   sizeGB: 1
